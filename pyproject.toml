[project]
name = "elkollen"
version = "0.1.0"
description = "Electricity assistant for Sweden built on 15-minute day-ahead prices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "tzdata>=2024.1",   # zoneinfo needs this on Windows
  "duckdb>=1.1",
]

[project.optional-dependencies]
# local + CI transformations run on DuckDB; Snowflake extras only where Snowflake is used
dbt = ["dbt-core>=1.9,<2", "dbt-duckdb>=1.9"]
snowflake = ["snowflake-connector-python>=3.12", "dbt-snowflake>=1.9"]
# Next-day price forecast (phase 5), ported from thar-26/elpris-forecast
forecast = ["numpy>=2", "pandas>=2.2", "scikit-learn>=1.5"]
# API and MCP server (phase 3)
api = ["fastapi>=0.115", "uvicorn>=0.30", "pyjwt>=2.8", "mcp>=2.3,<3"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
elkollen-ingest = "elkollen_ingest.cli:main"
elkollen-mcp = "elkollen_mcp.server:main"
elkollen-forecast = "elkollen_forecast.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "DTZ"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
