name: elkollen
version: "0.1.0"
config-version: 2
profile: elkollen

# Run from the repository root:
#   dbt build --project-dir dbt --profiles-dir dbt
# so relative paths (DuckDB file) resolve the same way as for the ingestion CLI.

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  price_areas: ["SE1", "SE2", "SE3", "SE4"]
  # Sanity band for day-ahead prices in EUR/kWh. SDAC's harmonised minimum clearing
  # price is -500 EUR/MWh (-0.5 EUR/kWh). The maximum has been raised over time, so
  # the upper bound has generous headroom. Negative prices are expected and must pass.
  price_eur_per_kwh_min: -0.5
  price_eur_per_kwh_max: 10

models:
  elkollen:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    # Intermediate models live next to staging: Terraform creates exactly three
    # schemas (RAW, STAGING, MARTS) and the READER role cannot see STAGING.
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  elkollen:
    +schema: marts

data_tests:
  elkollen:
    +severity: error
