name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # Tests build their own DuckDB warehouse with dbt and exercise the API and MCP server.
      - run: pip install -c requirements-lock.txt -e ".[dev,dbt,api,forecast]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  dbt:
    name: dbt build (DuckDB, real fixture days)
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: data/ci.duckdb
      DBT_TARGET: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -c requirements-lock.txt -e ".[dbt]"
      - name: Load fixtures into RAW (offline, no network)
        run: elkollen-ingest load-fixtures fixtures/elpris
      - name: Load invented ENTSO-E forecasts (real format, invented values)
        run: elkollen-ingest load-entsoe-fixtures fixtures/entsoe
      - name: Synthetic demo users (no real meter data)
        run: elkollen-ingest synthetic-consumption --start 2025-09-29 --end 2025-10-05
      - name: dbt build (models, data tests, unit tests)
        # Fixtures are separate windows of real days, so the "no missing days" check
        # runs on the contiguous window 2025-09-29..2025-10-05 (the hourly -> 15-minute
        # switch). Tests tagged `live` are about the real clock (is tomorrow's price
        # in?) and run in the scheduled Snowflake workflow, not on fixtures.
        run: >
          dbt build --project-dir dbt --profiles-dir dbt --exclude tag:live
          --vars '{price_continuity_start: "2025-09-29", price_continuity_end: "2025-10-05"}'
      - name: dbt docs generate
        run: dbt docs generate --project-dir dbt --profiles-dir dbt

  web:
    name: Web (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Placeholders so the build can run; no real secrets in CI.
      AUTH_SECRET: ci-placeholder-not-a-secret-000000000000
      ELKOLLEN_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform (fmt + validate, no apply)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
