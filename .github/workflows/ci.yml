name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -c requirements-lock.txt -e ".[dev,dbt]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  dbt:
    name: dbt build (DuckDB, real fixture days)
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: data/ci.duckdb
      DBT_TARGET: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -c requirements-lock.txt -e ".[dbt]"
      - name: Load fixtures into RAW (offline, no network)
        run: elkollen-ingest load-fixtures fixtures/elpris
      - name: dbt build (models, data tests, unit tests)
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: dbt docs generate
        run: dbt docs generate --project-dir dbt --profiles-dir dbt

  terraform:
    name: Terraform (fmt + validate, no apply)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
